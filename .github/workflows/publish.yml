# Publishes the 3 team pages (Action Plan, Competitor Brief, Ad Library).
#
# The Sunday cloud routine builds the pages and posts them to the Apps Script
# relay (the cloud can't push to GitHub). This job fetches them, locks each
# page with the team password and commits the result, which GitHub Pages serves.
# It makes no paid calls. Off weeks the pages are unchanged, so nothing commits.
name: Publish team pages

on:
  schedule:
    - cron: "0 12 * * 0"   # Sunday 12:00 UTC, 3 hours after the routine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pages from the relay
        env:
          KEY: ${{ secrets.DASHBOARD_PUSH_KEY }}
          RELAY: https://script.google.com/macros/s/AKfycbxLLVcjXSNYvuBHOG4yqBwBGxkJv6Vbiz6ejaVyRi9ybLPDidJot4zhKAcCHFgD34nY/exec
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          for p in index brief ads; do
            curl -sSfL --retry 3 "$RELAY?page=$p&key=$KEY" -o "$RUNNER_TEMP/src/$p.html"
            size=$(wc -c < "$RUNNER_TEMP/src/$p.html")
            # A missing or half-sent page must never replace a good one.
            if [ "$size" -lt 20000 ] || ! grep -qi '</html>' "$RUNNER_TEMP/src/$p.html"; then
              echo "::error::$p.html from the relay is missing or incomplete ($size bytes)"
              exit 1
            fi
            echo "$p.html: $size bytes"
          done

      - name: Lock pages with the team password
        env:
          PASSWORD: ${{ secrets.TEAM_DASHBOARD_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP/src"
          # Fixed salt so the team's "remember me" survives every update.
          printf '{"salt":"37bbd428b013530978b451922c021dc1"}' > .staticrypt.json
          npx --yes staticrypt@3.5.4 index.html brief.html ads.html \
            -p "$PASSWORD" --short --remember 30 \
            -t "$GITHUB_WORKSPACE/.github/team_template.html" \
            --template-title "Entag team dashboard" \
            --template-instructions "Enter the team password to open." \
            --template-color-primary "#036D35" \
            -d "$GITHUB_WORKSPACE"

      - name: Commit if anything changed
        run: |
          touch .nojekyll
          git add -A index.html brief.html ads.html .nojekyll
          if git diff --cached --quiet; then
            echo "Pages unchanged, nothing to publish"
            exit 0
          fi
          git -c user.name=entag-bot -c user.email=bot@users.noreply.github.com \
            commit -qm "Team pages $(date -u +%F)"
          git push -q
